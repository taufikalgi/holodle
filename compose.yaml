x-app: &app
  image: ${IMAGE:?IMAGE is required}
  restart: unless-stopped
  init: true
  environment:
    NODE_ENV: production
    PORT: "3000"
    HOSTNAME: "0.0.0.0"
    # Digest of the image this container was started from. Exposed by
    # /api/version so the deploy can prove the new build is actually live.
    BUILD_ID: ${IMAGE:?IMAGE is required}
  mem_limit: 768m
  cpus: 1.0
  stop_grace_period: 10s
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  app-blue:
    <<: *app
    ports:
      - "127.0.0.1:${BLUE_PORT:?BLUE_PORT is required}:3000"

  app-green:
    <<: *app
    ports:
      - "127.0.0.1:${GREEN_PORT:?GREEN_PORT is required}:3000"

name: CI/CD Deploy

on:
  push:
    branches:
      - master
      - dev

jobs:
  deploy:
    name: Deploy (${{ github.ref_name == 'master' || 'staging' }})
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v6

      # ── 2. Set environment config based on branch ──────────────────────────
      - name: Set environment config
        id: config
        run: |
          if [[ "${{ github.ref_name }}" == "master" ]]; then
            echo "ENV_NAME=production"                             >> $GITHUB_OUTPUT
            echo "SSH_HOST=${{ secrets.HOST }}"              >> $GITHUB_OUTPUT
            echo "SSH_USER=${{ secrets.USER }}"              >> $GITHUB_OUTPUT
            echo "DEPLOY_PATH=${{ secrets.PROD_DEPLOY_PATH }}"    >> $GITHUB_OUTPUT
            echo "APP_PORT=3001"                                  >> $GITHUB_OUTPUT
            echo "PM2_APP=holodle-prod"                            >> $GITHUB_OUTPUT
            {
              echo "SSH_KEY<<EOF"
              echo "${{ secrets.SSH_KEY }}"
              echo "EOF"
            } >> $GITHUB_OUTPUT
            echo "NEXT_PUBLIC_GOOGLE_AUTH_URL=${{ secrets.NEXT_PUBLIC_GOOGLE_AUTH_URL_PROD }}" >> $GITHUB_OUTPUT
            echo "NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL_PROD }}" >> $GITHUB_OUTPUT
          else
            echo "ENV_NAME=staging"                               >> $GITHUB_OUTPUT
            echo "SSH_HOST=${{ secrets.HOST }}"           >> $GITHUB_OUTPUT
            echo "SSH_USER=${{ secrets.USER }}"           >> $GITHUB_OUTPUT
            echo "DEPLOY_PATH=${{ secrets.STAGING_DEPLOY_PATH }}" >> $GITHUB_OUTPUT
            echo "APP_PORT=3002"                                  >> $GITHUB_OUTPUT
            echo "PM2_APP=holodle-staging"                         >> $GITHUB_OUTPUT
            {
              echo "SSH_KEY<<EOF"
              echo "${{ secrets.SSH_KEY }}"
              echo "EOF"
            } >> $GITHUB_OUTPUT
            echo "NEXT_PUBLIC_GOOGLE_AUTH_URL=${{ secrets.NEXT_PUBLIC_GOOGLE_AUTH_URL_STAGING }}" >> $GITHUB_OUTPUT
            echo "NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL_STAGING }}" >> $GITHUB_OUTPUT
          fi

      # ── 3. Setup pnpm ───────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      # ── 4. Setup Node.js ───────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # ── 5. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 6. Lint ────────────────────────────────────────────────────────────
      - name: Lint
        run: pnpm run lint

      # ── 7. Run checks ──────────────────────────────────────────────────────
      - name: Run checks
        run: pnpm test

      - name: Typecheck
        run: pnpm run typecheck

      # ── 8. Build Next.js ───────────────────────────────────────────────────
      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_GOOGLE_AUTH_URL: ${{ steps.config.outputs.NEXT_PUBLIC_GOOGLE_AUTH_URL }}
          NEXT_PUBLIC_API_URL: ${{ steps.config.outputs.NEXT_PUBLIC_API_URL }}

      # ── 9. Bundle build artifact ───────────────────────────────────────────
      # Packages only what's needed to run on the server (no devDependencies)
      - name: Package build artifact
        run: |
          tar -czf artifact.tar.gz \
            .next \
            public \
            package.json \
            pnpm-lock.yaml \
            next.config.* \
            next-env.d.ts 2>/dev/null || true

      # ── 10. Upload artifact to Droplet ─────────────────────────────────────
      - name: Upload artifact
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.config.outputs.SSH_HOST }}
          username: ${{ steps.config.outputs.SSH_USER }}
          key: ${{ steps.config.outputs.SSH_KEY }}
          source: artifact.tar.gz
          target: ${{ steps.config.outputs.DEPLOY_PATH }}

      # ── 10. Deploy on Droplet ─────────────────────────────────────────────
      - name: Deploy to ${{ steps.config.outputs.ENV_NAME }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.config.outputs.SSH_HOST }}
          username: ${{ steps.config.outputs.SSH_USER }}
          key: ${{ steps.config.outputs.SSH_KEY }}
          script: |
            set -eu

            DEPLOY_PATH="${{ steps.config.outputs.DEPLOY_PATH }}"
            PM2_APP="${{ steps.config.outputs.PM2_APP }}"
            APP_PORT="${{ steps.config.outputs.APP_PORT }}"
            ENV_NAME="${{ steps.config.outputs.ENV_NAME }}"

            NODE_VERSION="24.22.3"
            PNPM_VERSION="10.30.3"

            log() { echo "[deploy] $*"; }

            # ── Toolchain resolution ──────────────────────────────────────────
            # This script runs in a non-interactive SSH shell, which does not read
            # .bashrc/.profile. A Node installed through nvm, volta or asdf is
            # therefore invisible here, which is how a deploy can fail with
            # "pnpm: command not found" while every manual SSH session works.
            # Make the usual locations explicit and install what is missing.
            export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$HOME/.local/share/pnpm:$HOME/.nvm/current/bin:/usr/local/bin:/usr/local/sbin:/usr/bin:/bin:/snap/bin:$PATH"

            NODE_CURRENT=""
            if command -v node >/dev/null 2>&1; then
              NODE_CURRENT="$(node -v 2>/dev/null | sed 's/^v//')"
            fi

            # 1 = install, 0 = current node is at least NODE_VERSION
            NODE_NEEDS_INSTALL=1
            if [ -n "$NODE_CURRENT" ]; then
              NODE_NEEDS_INSTALL="$(awk -v cur="$NODE_CURRENT" -v want="$NODE_VERSION" 'BEGIN{
                split(cur,a,"."); split(want,b,".");
                for(i=1;i<=3;i++){ if(a[i]+0>b[i]+0){print 0; exit} if(a[i]+0<b[i]+0){print 1; exit} }
                print 0
              }')"
            fi

            NODE_CHANGED=0
            if [ "$NODE_NEEDS_INSTALL" = "1" ]; then
              log "node ${NODE_CURRENT:-missing} is older than v$NODE_VERSION; installing v$NODE_VERSION"
              case "$(uname -m)" in
                x86_64|amd64) ARCH="x64" ;;
                aarch64|arm64) ARCH="arm64" ;;
                *) echo "ERROR: unsupported architecture $(uname -m)"; exit 1 ;;
              esac
              NODE_DIR="node-v$NODE_VERSION-linux-$ARCH"
              mkdir -p "$HOME/.local/opt" "$HOME/.local/bin"
              if [ ! -d "$HOME/.local/opt/$NODE_DIR" ]; then
                NODE_URL="https://nodejs.org/dist/v$NODE_VERSION/$NODE_DIR.tar.xz"
                if command -v curl >/dev/null 2>&1; then
                  curl -fsSL "$NODE_URL" -o "$HOME/.local/opt/node.tar.xz"
                elif command -v wget >/dev/null 2>&1; then
                  wget -q "$NODE_URL" -O "$HOME/.local/opt/node.tar.xz"
                else
                  echo "ERROR: need curl or wget to install Node"; exit 1
                fi
                tar -xJf "$HOME/.local/opt/node.tar.xz" -C "$HOME/.local/opt"
                rm -f "$HOME/.local/opt/node.tar.xz"
              fi
              for BIN in node npm npx; do
                ln -sf "$HOME/.local/opt/$NODE_DIR/bin/$BIN" "$HOME/.local/bin/$BIN"
              done
              hash -r 2>/dev/null || true
              NODE_CHANGED=1
            fi
            log "node $(node -v)"

            if ! command -v pnpm >/dev/null 2>&1 || [ "$(pnpm -v)" != "$PNPM_VERSION" ]; then
              log "installing pnpm $PNPM_VERSION"
              npm install -g --prefix "$HOME/.local" "pnpm@$PNPM_VERSION" >/dev/null 2>&1
              hash -r 2>/dev/null || true
            fi
            log "pnpm $(pnpm -v)"

            if ! command -v pm2 >/dev/null 2>&1; then
              log "installing pm2"
              npm install -g --prefix "$HOME/.local" pm2 >/dev/null 2>&1
              hash -r 2>/dev/null || true
            fi
            log "pm2 $(pm2 -v 2>/dev/null | tail -1)"

            # ── Deploy ────────────────────────────────────────────────────────
            [ -d "$DEPLOY_PATH" ] || { echo "ERROR: deploy path $DEPLOY_PATH does not exist"; exit 1; }
            cd "$DEPLOY_PATH"

            # Extract new build
            tar -xzf artifact.tar.gz
            rm -f artifact.tar.gz

            # Install production dependencies only, exactly as CI resolved them
            pnpm install --prod --frozen-lockfile

            # Copy environment file
            # Expects .env.production or .env.staging to already exist on the server
            cp ".env.$ENV_NAME" .env.local 2>/dev/null || true

            # A pm2 daemon keeps the Node interpreter it was started with, so a
            # Node upgrade above would otherwise leave the app on the old runtime.
            if [ "$NODE_CHANGED" = "1" ] && pm2 show "$PM2_APP" >/dev/null 2>&1; then
              log "restarting pm2 daemon on node $(node -v)"
              pm2 update >/dev/null 2>&1 || true
            fi

            # Reload app with PM2 (zero-downtime reload)
            if pm2 show "$PM2_APP" >/dev/null 2>&1; then
              pm2 reload "$PM2_APP" --update-env
            else
              PORT="$APP_PORT" pm2 start pnpm --name "$PM2_APP" --update-env -- start
              pm2 save
            fi

            log "deployed to $ENV_NAME on port $APP_PORT"

name: Deploy

on:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref_name == 'master' && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate public build config
    if: github.ref_name == 'master' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOOGLE_AUTH_URL: ${{ github.ref_name == 'master' && vars.NEXT_PUBLIC_GOOGLE_AUTH_URL_PROD || vars.NEXT_PUBLIC_GOOGLE_AUTH_URL_STAGING }}
      API_URL: ${{ github.ref_name == 'master' && vars.NEXT_PUBLIC_API_URL_PROD || vars.NEXT_PUBLIC_API_URL_STAGING }}
    steps:
      - name: Check public build variables
        run: |
          set -euo pipefail
          [ -n "$GOOGLE_AUTH_URL" ] || { echo "Missing NEXT_PUBLIC_GOOGLE_AUTH_URL_PROD/STAGING repository variable" >&2; exit 1; }
          [ -n "$API_URL" ] || { echo "Missing NEXT_PUBLIC_API_URL_PROD/STAGING repository variable" >&2; exit 1; }

  ci:
    needs: validate
    if: github.ref_name == 'master' || github.ref_name == 'dev'
    uses: ./.github/workflows/ci.yml
    with:
      push-image: true
      next-public-google-auth-url: ${{ github.ref_name == 'master' && vars.NEXT_PUBLIC_GOOGLE_AUTH_URL_PROD || vars.NEXT_PUBLIC_GOOGLE_AUTH_URL_STAGING }}
      next-public-api-url: ${{ github.ref_name == 'master' && vars.NEXT_PUBLIC_API_URL_PROD || vars.NEXT_PUBLIC_API_URL_STAGING }}

  deploy:
    name: Deploy (${{ github.ref_name == 'master' && 'production' || 'staging' }})
    needs: ci
    if: github.ref_name == 'master' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
    env:
      ENV_NAME: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
      BLUE_PORT: ${{ github.ref_name == 'master' && '3001' || '3002' }}
      GREEN_PORT: ${{ github.ref_name == 'master' && '3003' || '3004' }}
      DEPLOY_PATH: ${{ github.ref_name == 'master' && secrets.PROD_DEPLOY_PATH || secrets.STAGING_DEPLOY_PATH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve image digest
        env:
          DIGEST: ${{ needs.ci.outputs.image-digest }}
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "CI did not produce an image digest" >&2; exit 1; }
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${{ github.repository }}@$DIGEST" >> "$GITHUB_ENV"

      - name: Validate configuration
        env:
          SSH_HOST: ${{ secrets.HOST }}
          SSH_USER: ${{ secrets.USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          : "${DEPLOY_PATH:?PROD_DEPLOY_PATH or STAGING_DEPLOY_PATH is not set}"
          : "${BLUE_PORT:?BLUE_PORT is not set}"
          : "${GREEN_PORT:?GREEN_PORT is not set}"
          : "${IMAGE:?IMAGE is not set}"
          : "${IMAGE_DIGEST:?IMAGE_DIGEST is not set}"
          : "${SSH_HOST:?HOST secret is not set}"
          : "${SSH_USER:?USER secret is not set}"
          : "${SSH_KEY:?SSH_KEY secret is not set}"
          case "$DEPLOY_PATH" in
            /*) ;;
            *) echo "DEPLOY_PATH must be absolute" >&2; exit 1 ;;
          esac
          case "$BLUE_PORT" in
            *[!0-9]*) echo "BLUE_PORT must be numeric" >&2; exit 1 ;;
          esac
          case "$GREEN_PORT" in
            *[!0-9]*) echo "GREEN_PORT must be numeric" >&2; exit 1 ;;
          esac
          [ "$BLUE_PORT" != "$GREEN_PORT" ] || { echo "BLUE_PORT and GREEN_PORT must differ" >&2; exit 1; }
          case "$IMAGE" in
            ghcr.io/*@sha256:*) ;;
            *) echo "IMAGE must be pinned by digest" >&2; exit 1 ;;
          esac

      - name: Set up SSH agent
        uses: ./.github/actions/setup-ssh
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add host to known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.HOST }}" >> ~/.ssh/known_hosts

      - name: Upload deploy files
        run: |
          set -euo pipefail
          rsync -azR --mkpath \
            compose.yaml \
            scripts/deploy-remote.sh \
            "${{ secrets.USER }}@${{ secrets.HOST }}:${{ env.DEPLOY_PATH }}/"
          ssh "${{ secrets.USER }}@${{ secrets.HOST }}" \
            "test -f '${{ env.DEPLOY_PATH }}/compose.yaml' && test -f '${{ env.DEPLOY_PATH }}/scripts/deploy-remote.sh'"

      - name: Deploy
        run: |
          # These values are intentionally expanded locally into the remote env.
          # shellcheck disable=SC2029
          ssh "${{ secrets.USER }}@${{ secrets.HOST }}" \
            "DEPLOY_PATH='$DEPLOY_PATH' ENV_NAME='$ENV_NAME' IMAGE='$IMAGE' BLUE_PORT='$BLUE_PORT' GREEN_PORT='$GREEN_PORT' bash -s" <<'ENDSSH'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          bash scripts/deploy-remote.sh
          ENDSSH

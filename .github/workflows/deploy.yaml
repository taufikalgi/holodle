name: Deploy

on:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref_name == 'master' && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  ci:
    if: github.ref_name == 'master' || github.ref_name == 'dev'
    uses: ./.github/workflows/ci.yml
    with:
      push-image: true
      next-public-google-auth-url: ${{ github.ref_name == 'master' && vars.NEXT_PUBLIC_GOOGLE_AUTH_URL_PROD || vars.NEXT_PUBLIC_GOOGLE_AUTH_URL_STAGING }}
      next-public-api-url: ${{ github.ref_name == 'master' && vars.NEXT_PUBLIC_API_URL_PROD || vars.NEXT_PUBLIC_API_URL_STAGING }}

  deploy:
    name: Deploy (${{ github.ref_name == 'master' && 'production' || 'staging' }})
    needs: ci
    if: github.ref_name == 'master' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
    env:
      ENV_NAME: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
      BLUE_PORT: ${{ github.ref_name == 'master' && '3001' || '3002' }}
      GREEN_PORT: ${{ github.ref_name == 'master' && '3003' || '3004' }}
      DEPLOY_PATH: ${{ github.ref_name == 'master' && secrets.PROD_DEPLOY_PATH || secrets.STAGING_DEPLOY_PATH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve image digest
        env:
          DIGEST: ${{ needs.ci.outputs.image-digest }}
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "CI did not produce an image digest" >&2; exit 1; }
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${{ github.repository }}@$DIGEST" >> "$GITHUB_ENV"

      - name: Validate configuration
        env:
          SSH_HOST: ${{ secrets.HOST }}
          SSH_USER: ${{ secrets.USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          : "${DEPLOY_PATH:?PROD_DEPLOY_PATH or STAGING_DEPLOY_PATH is not set}"
          : "${BLUE_PORT:?BLUE_PORT is not set}"
          : "${GREEN_PORT:?GREEN_PORT is not set}"
          : "${IMAGE:?IMAGE is not set}"
          : "${IMAGE_DIGEST:?IMAGE_DIGEST is not set}"
          : "${GHCR_USER:?GHCR_USER secret is not set}"
          : "${GHCR_TOKEN:?GHCR_TOKEN secret is not set}"
          : "${SSH_HOST:?HOST secret is not set}"
          : "${SSH_USER:?USER secret is not set}"
          : "${SSH_KEY:?SSH_KEY secret is not set}"
          : "${SSH_HOST_FINGERPRINT:?SSH_HOST_FINGERPRINT secret is not set}"
          case "$DEPLOY_PATH" in
            /*) ;;
            *) echo "DEPLOY_PATH must be absolute" >&2; exit 1 ;;
          esac
          case "$BLUE_PORT" in
            *[!0-9]*) echo "BLUE_PORT must be numeric" >&2; exit 1 ;;
          esac
          case "$GREEN_PORT" in
            *[!0-9]*) echo "GREEN_PORT must be numeric" >&2; exit 1 ;;
          esac
          [ "$BLUE_PORT" != "$GREEN_PORT" ] || { echo "BLUE_PORT and GREEN_PORT must differ" >&2; exit 1; }
          case "$IMAGE" in
            ghcr.io/*@sha256:*) ;;
            *) echo "IMAGE must be pinned by digest" >&2; exit 1 ;;
          esac

      - name: Upload deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          source: "compose.yaml,scripts/deploy-remote.sh"
          target: ${{ env.DEPLOY_PATH }}
          overwrite: true

      - name: Deploy
        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          command_timeout: 10m
          script_stop: true
          envs: DEPLOY_PATH,ENV_NAME,IMAGE,BLUE_PORT,GREEN_PORT,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            bash scripts/deploy-remote.sh

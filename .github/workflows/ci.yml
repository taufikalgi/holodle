name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      push-image:
        description: Push the built image to GHCR
        type: boolean
        default: false
      next-public-google-auth-url:
        description: Build-time Google auth URL
        type: string
        default: "https://example.invalid/google-auth"
      next-public-api-url:
        description: Build-time API URL
        type: string
        default: "https://example.invalid/api"
    outputs:
      image-digest:
        description: Digest of the built image
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check deploy script
        run: |
          bash -n scripts/deploy-remote.sh
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck scripts/deploy-remote.sh

  image:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      NEXT_PUBLIC_GOOGLE_AUTH_URL: ${{ github.event_name == 'pull_request' && 'https://example.invalid/google-auth' || inputs.next-public-google-auth-url }}
      NEXT_PUBLIC_API_URL: ${{ github.event_name == 'pull_request' && 'https://example.invalid/api' || inputs.next-public-api-url }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read tool versions
        id: versions
        run: |
          echo "node=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(node -p 'require("./package.json").packageManager.split("@")[1].split("+")[0]')" >> "$GITHUB_OUTPUT"

      - name: Validate public build args
        run: |
          test -n "$NEXT_PUBLIC_GOOGLE_AUTH_URL"
          test -n "$NEXT_PUBLIC_API_URL"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ inputs.push-image }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ inputs.push-image }}
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            NODE_VERSION=${{ steps.versions.outputs.node }}
            PNPM_VERSION=${{ steps.versions.outputs.pnpm }}
            NEXT_PUBLIC_GOOGLE_AUTH_URL=${{ env.NEXT_PUBLIC_GOOGLE_AUTH_URL }}
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to: ${{ inputs.push-image && 'type=gha,mode=max' || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
